services:
  - type: web
    name: essential911-hub
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: essential911-hub-db
          property: connectionString
      - key: STATIC_DIR
        value: /app/dist
      - key: HOST
        value: 0.0.0.0

databases:
  - name: essential911-hub-db
    plan: free
    region: singapore
    databaseName: essential911_hub
    user: hub
